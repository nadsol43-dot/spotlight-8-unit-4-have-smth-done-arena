<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Визуальная памятка по английской конструкции have something done">
  <title>Have something done — визуальная памятка</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #eaf0ef;
      font-family: Arial, sans-serif;
      padding: 24px;
    }
    main {
      width: min(100%, 1440px);
      margin: 0 auto;
      background: #f4f7f6;
      box-shadow: 0 12px 40px rgba(23, 50, 77, .10);
    }
    svg { display: block; width: 100%; height: auto; }
    @media (max-width: 600px) {
      body { padding: 0; }
      main { box-shadow: none; }
    }
  </style>
</head>
<body>
  <main aria-label="Визуальная памятка по английской грамматике">
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1200" viewBox="0 0 1440 1200" role="img" aria-labelledby="title desc">
  <title id="title">Have something done — визуальная памятка</title>
  <desc id="desc">Схема английской конструкции have something done с формулой, примерами про ремонт машины и доставку компьютера, а также сравнением с активным залогом.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#17324d" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#62b8ac"/>
    </marker>
  </defs>
  <rect width="1440" height="1200" fill="#f4f7f6"/>
  <circle cx="1330" cy="90" r="120" fill="#e5f2ef" opacity=".72"/>
  <circle cx="1375" cy="180" r="42" fill="#d4ebe6" opacity=".8"/>

  <!-- Header -->
  <rect x="80" y="54" width="186" height="34" rx="17" fill="#dcefeb"/>
  <text x="173" y="77" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#176f69">ENGLISH GRAMMAR</text>
  <text x="80" y="151" font-family="Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="1" fill="#17324d">HAVE SOMETHING DONE</text>
  <text x="82" y="198" font-family="Arial, sans-serif" font-size="24" fill="#526875">Вы организуете услугу — работу обычно выполняет кто-то другой.</text>
  <rect x="1105" y="118" width="245" height="50" rx="25" fill="#fff0cf"/>
  <text x="1227" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#785723">«СДЕЛАТЬ ДЛЯ СЕБЯ»</text>

  <!-- Formula card -->
  <rect x="80" y="232" width="1280" height="218" rx="28" fill="#17324d" filter="url(#shadow)"/>
  <text x="112" y="273" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.7" fill="#9ecac4">ФОРМУЛА</text>
  <text x="1320" y="273" text-anchor="end" font-family="Arial, sans-serif" font-size="15" fill="#b6c8d2">подлежащее + have + объект + V3</text>

  <rect x="112" y="294" width="230" height="76" rx="16" fill="#294660"/>
  <text x="227" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="800" fill="#ffffff">ПОДЛЕЖАЩЕЕ</text>
  <text x="227" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#c7d6de">кто заказывает?</text>

  <text x="366" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="500" fill="#72c6bb">+</text>

  <rect x="393" y="294" width="205" height="76" rx="16" fill="#287d79"/>
  <text x="495" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#ffffff">HAVE</text>
  <text x="495" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#d8f0ec">форма меняется</text>

  <text x="623" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="500" fill="#72c6bb">+</text>

  <rect x="650" y="294" width="225" height="76" rx="16" fill="#294660"/>
  <text x="762" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#ffffff">OBJECT</text>
  <text x="762" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#c7d6de">что / кого?</text>

  <text x="900" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="500" fill="#72c6bb">+</text>

  <rect x="927" y="294" width="245" height="76" rx="16" fill="#f1c76e"/>
  <text x="1049" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#17324d">V3</text>
  <text x="1049" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4b5360">past participle</text>

  <path d="M1195 332 H1296" fill="none" stroke="#62b8ac" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1245" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#b6c8d2">РЕЗУЛЬТАТ</text>
  <text x="112" y="414" font-family="Arial, sans-serif" font-size="17" fill="#d3dfe5">Например: arrange a repair → организовать ремонт. Сам исполнитель обычно не важен.</text>

  <!-- Example card 1 -->
  <rect x="80" y="478" width="625" height="390" rx="26" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="110" y="505" width="34" height="34" rx="11" fill="#dcefeb"/>
  <text x="127" y="529" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#176f69">01</text>
  <text x="158" y="530" font-family="Arial, sans-serif" font-size="19" font-weight="800" letter-spacing=".6" fill="#526875">РЕМОНТ АВТОМОБИЛЯ</text>

  <text x="110" y="590" font-family="Arial, sans-serif" font-size="29" font-weight="700">
    <tspan fill="#17324d">Tom </tspan><tspan fill="#7960a8">has </tspan><tspan fill="#287d79">had </tspan><tspan fill="#c87540">his car </tspan><tspan fill="#287d79">repaired.</tspan>
  </text>
  <line x1="110" y1="606" x2="675" y2="606" stroke="#e9efed" stroke-width="2"/>

  <rect x="110" y="624" width="565" height="76" rx="16" fill="#eef7f5"/>
  <text x="132" y="651" font-family="Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1.2" fill="#287d79">СМЫСЛ</text>
  <text x="132" y="680" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Том организовал ремонт машины.</text>

  <text x="110" y="735" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d">Разбираем форму:</text>
  <rect x="110" y="751" width="250" height="48" rx="12" fill="#f1edfa"/>
  <text x="126" y="781" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#72559b">has</text>
  <text x="164" y="781" font-family="Arial, sans-serif" font-size="14" fill="#4f5d68">вспомогательный have</text>
  <rect x="374" y="751" width="301" height="48" rx="12" fill="#e6f4f1"/>
  <text x="390" y="781" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#176f69">had</text>
  <text x="430" y="781" font-family="Arial, sans-serif" font-size="14" fill="#4f5d68">have в форме V3</text>

  <circle cx="120" cy="833" r="7" fill="#f1c76e"/>
  <text x="139" y="839" font-family="Arial, sans-serif" font-size="16" fill="#526875">Ремонт выполняет механик, а не Том.</text>

  <!-- Example card 2 -->
  <rect x="735" y="478" width="625" height="390" rx="26" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="765" y="505" width="34" height="34" rx="11" fill="#fff0cf"/>
  <text x="782" y="529" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#9a7025">02</text>
  <text x="813" y="530" font-family="Arial, sans-serif" font-size="19" font-weight="800" letter-spacing=".6" fill="#526875">ДОСТАВКА КОМПЬЮТЕРА</text>

  <text x="765" y="579" font-family="Arial, sans-serif" font-size="26" font-weight="700">
    <tspan fill="#17324d">They </tspan><tspan fill="#7960a8">are having </tspan><tspan fill="#c87540">their computer</tspan>
  </text>
  <text x="765" y="612" font-family="Arial, sans-serif" font-size="26" font-weight="700">
    <tspan fill="#287d79">delivered</tspan><tspan fill="#17324d"> tomorrow.</tspan>
  </text>
  <line x1="765" y1="628" x2="1330" y2="628" stroke="#e9efed" stroke-width="2"/>

  <rect x="765" y="644" width="565" height="76" rx="16" fill="#fff7e7"/>
  <text x="787" y="671" font-family="Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1.2" fill="#9a7025">СМЫСЛ</text>
  <text x="787" y="700" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">Им завтра доставят компьютер.</text>

  <text x="765" y="755" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d">Фокус — на организованной услуге:</text>
  <rect x="765" y="771" width="565" height="48" rx="12" fill="#f3f6f8"/>
  <text x="787" y="801" font-family="Arial, sans-serif" font-size="15" fill="#526875">Они устроили доставку; курьер здесь не назван.</text>
  <circle cx="775" cy="841" r="7" fill="#f1c76e"/>
  <text x="794" y="847" font-family="Arial, sans-serif" font-size="16" fill="#526875">tomorrow показывает, когда будет услуга.</text>

  <!-- Meaning contrast -->
  <rect x="80" y="898" width="1280" height="254" rx="26" fill="#e9f0f3"/>
  <text x="112" y="941" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#17324d">КТО ВЫПОЛНЯЕТ ДЕЙСТВИЕ? СРАВНИ СМЫСЛ</text>
  <rect x="110" y="965" width="560" height="105" rx="17" fill="#ffffff"/>
  <circle cx="143" cy="1017" r="17" fill="#e5ebf5"/>
  <path d="M135 1020 l7 -8 7 8 M142 1012 v14" fill="none" stroke="#607995" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="174" y="1008" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d">Tom repaired his car.</text>
  <text x="174" y="1042" font-family="Arial, sans-serif" font-size="18" fill="#526875">Том сам починил автомобиль.</text>

  <rect x="690" y="965" width="640" height="105" rx="17" fill="#ffffff"/>
  <circle cx="724" cy="1017" r="17" fill="#dcefeb"/>
  <path d="M716 1020 l7 -8 7 8 M723 1012 v14" fill="none" stroke="#287d79" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="755" y="1008" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d">Tom had his car repaired.</text>
  <text x="755" y="1042" font-family="Arial, sans-serif" font-size="18" fill="#526875">Том организовал ремонт — сделал механик.</text>

  <rect x="110" y="1091" width="1220" height="40" rx="12" fill="#d9e7e8"/>
  <circle cx="133" cy="1111" r="8" fill="#287d79"/>
  <text x="153" y="1117" font-family="Arial, sans-serif" font-size="16" fill="#294653">Исполнителя обычно не упоминают: он неважен или понятен из контекста.</text>
</svg>
  </main>
</body>
</html>
